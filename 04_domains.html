<style>
  :root{
    --bg:#0B0F14; --card:#141A21; --line:#232D38; --text:#E6EAF0;
    --muted:#8B93A1; --accent:#2DD4BF; --accent-soft:rgba(45,212,191,.12);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:#06090C; color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    display:flex; justify-content:center; min-height:100vh;
  }
  .phone{width:100%; max-width:375px; background:var(--bg); min-height:100vh; padding:22px 18px 90px; position:relative;}
  .brand{font-size:12px; letter-spacing:.14em; color:var(--muted); text-transform:uppercase; margin-bottom:14px;}
  h1{font-size:20px; line-height:1.5; margin:0 0 8px; font-weight:600;}
  p{margin:0 0 12px; font-size:14px; line-height:1.7; color:var(--muted);}
  .note{font-size:12px; line-height:1.7; color:var(--muted);}
  .search{
    width:100%; font:inherit; font-size:14px; color:var(--text); background:var(--card);
    border:1px solid var(--line); border-radius:12px; padding:11px 12px; margin:10px 0 14px; outline:none;
  }
  .search:focus{border-color:var(--accent)}
  .flabel{font-size:12px; color:var(--muted); margin:6px 0 8px;}
  .chips{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px;}
  .chips.scroll{flex-wrap:nowrap; overflow-x:auto; padding-bottom:4px; -webkit-overflow-scrolling:touch;}
  .chip{
    font:inherit; font-size:12px; padding:7px 12px; border-radius:20px; cursor:pointer;
    background:var(--card); border:1px solid var(--line); color:var(--muted); white-space:nowrap;
  }
  .chip.on{border-color:var(--accent); background:var(--accent-soft); color:var(--accent);}
  .card{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px; margin-bottom:10px;}
  .card.sel{border-color:var(--accent); background:var(--accent-soft);}
  .d-head{display:flex; justify-content:space-between; align-items:flex-start; gap:8px;}
  .d-name{font-size:15px; line-height:1.5; color:var(--text); font-weight:500;}
  .d-id{font-size:11px; color:var(--muted); margin-top:3px; word-break:break-all;}
  .pick{
    flex:0 0 auto; font:inherit; font-size:12px; padding:6px 10px; border-radius:8px; cursor:pointer;
    border:1px solid var(--line); background:transparent; color:var(--muted);
  }
  .pick.on{border-color:var(--accent); background:var(--accent); color:#06221E; font-weight:600;}
  .metrics{display:flex; gap:8px; margin:10px 0 0;}
  .m{flex:1; background:rgba(255,255,255,.03); border-radius:8px; padding:7px 8px;}
  .m .k{font-size:10px; color:var(--muted);}
  .m .v{font-size:15px; color:var(--text); font-weight:600; line-height:1.3;}
  .gardner{font-size:11px; color:var(--muted); margin-top:8px;}
  .toggle{background:none; border:none; font:inherit; font-size:12px; color:var(--accent); cursor:pointer; padding:8px 0 0;}
  .detail{margin-top:10px; border-top:1px solid var(--line); padding-top:10px;}
  .detail .note{margin-bottom:6px;}
  .detail .kv{display:flex; justify-content:space-between; font-size:12px; color:var(--muted); padding:3px 0;}
  .detail .kv b{color:var(--text); font-weight:500;}
  .empty{text-align:center; padding:28px 0; font-size:13px; color:var(--muted);}
  .dock{
    position:sticky; bottom:0; left:0; right:0; margin:16px -18px -90px; padding:12px 18px 22px;
    background:linear-gradient(180deg, rgba(11,15,20,.6), var(--bg) 40%); border-top:1px solid var(--line);
  }
  .btn{
    display:block; width:100%; font:inherit; font-size:15px; padding:14px; border-radius:12px; cursor:pointer;
    border:1px solid var(--accent); background:var(--accent); color:#06221E; font-weight:600;
  }
  .btn:disabled{opacity:.4; cursor:default;}
  .selbar{display:flex; justify-content:space-between; align-items:center; font-size:12px; color:var(--muted); margin-bottom:10px;}
  .selbar .n{color:var(--accent);}
  .foot{margin-top:14px;}
</style>

  rules: { min_select:3, max_select:5 }

/* ============================================================
   状态
   ============================================================ */
const state = { ms:"all", gardner:"all", kw:"", selected:[], expanded:null };

function load(){
  try{
    const raw = localStorage.getItem(DATA.meta.storage_key);
    if(raw){ const o = JSON.parse(raw); if(o && Array.isArray(o.selected)) state.selected = o.selected; }
  }catch(e){}
  /* TODO: 接入真实 API —— 按 user_id 拉取已选领域与候选列表排序 */
}
function save(){
  try{ localStorage.setItem(DATA.meta.storage_key, JSON.stringify({ selected:state.selected, updated_at:new Date().toISOString() })); }catch(e){}
  /* TODO: 接入真实 API —— PUT /api/v1/selection 上报用户选择，服务端需校验 3-5 个上限 */
}

/* ============================================================
   渲染
   ============================================================ */
const app = document.getElementById("app");
function el(html){ const d = document.createElement("div"); d.innerHTML = html.trim(); return d.firstChild; }
function tpl(s, kv){ return s.replace(/\{(\w+)\}/g, function(m,k){ return kv[k] !== undefined ? kv[k] : m; }); }
function isSel(id){ return state.selected.indexOf(id) > -1; }

function visible(){
  const kw = state.kw.trim().toLowerCase();
  return DATA.domains.filter(function(d){
    if(state.ms !== "all" && d.mechanism_strength !== parseInt(state.ms, 10)) return false;
    if(state.gardner !== "all" && d.gardner !== state.gardner) return false;
    if(kw && (d.name.toLowerCase().indexOf(kw) < 0) && (d.id.indexOf(kw) < 0)) return false;
    return true;
  });
}

function render(){
  app.innerHTML = "";
  const list = visible();

  app.appendChild(el(
    '<div>' +
      '<h1>' + DATA.copy.title + '</h1>' +
      '<p>' + DATA.copy.lead + '</p>' +
      '<p class="note">' + DATA.copy.hint + '</p>' +
    '</div>'
  ));

  /* 搜索 */
  const input = el('<input class="search" id="kw" placeholder="' + DATA.copy.search_ph + '" value="' + state.kw + '">');
  app.appendChild(input);
  input.oninput = function(){ state.kw = this.value; render(); document.getElementById("kw").focus(); };

  /* 机制强度筛选 1-5 */
  app.appendChild(el('<div class="flabel">' + DATA.copy.filter_ms + '</div>'));
  const msBox = el('<div class="chips" id="ms"></div>');
  app.appendChild(msBox);
  msBox.appendChild(chip(DATA.copy.all, state.ms === "all", function(){ state.ms = "all"; render(); }));
  [5,4,3,2,1].forEach(function(n){
    const cnt = DATA.domains.filter(function(d){ return d.mechanism_strength === n; }).length;
    msBox.appendChild(chip(tpl(DATA.copy.level_ms, {n:n}) + " · " + cnt, state.ms === String(n), function(){ state.ms = String(n); render(); }));
  });

  /* 智能类型筛选 */
  app.appendChild(el('<div class="flabel">' + DATA.copy.filter_gardner + '</div>'));
  const gBox = el('<div class="chips scroll" id="gd"></div>');
  app.appendChild(gBox);
  gBox.appendChild(chip(DATA.copy.all + " · 50", state.gardner === "all", function(){ state.gardner = "all"; render(); }));
  Object.keys(DATA.gardner).forEach(function(k){
    const cnt = DATA.domains.filter(function(d){ return d.gardner === k; }).length;
    gBox.appendChild(chip(DATA.gardner[k] + " · " + cnt, state.gardner === k, function(){ state.gardner = k; render(); }));
  });

  app.appendChild(el('<div class="note" style="margin:10px 0">' + tpl(DATA.copy.count, {n:list.length}) + '</div>'));

  /* 列表 */
  const box = el('<div id="list"></div>');
  app.appendChild(box);
  if(!list.length){ box.appendChild(el('<div class="empty">' + DATA.copy.empty + '</div>')); }
  list.forEach(function(d){ box.appendChild(domainCard(d)); });

  app.appendChild(el('<p class="note foot">' + DATA.copy.footer + '</p>'));
  app.appendChild(el('<p class="note">' + DATA.copy.unverified_note + '</p>'));

  /* 底部操作区 */
  const n = state.selected.length;
  const dock = el(
    '<div class="dock">' +
      '<div class="selbar"><span>' + DATA.copy.sel_label + ' <span class="n">' + n + '/' + DATA.rules.max_select + '</span></span><span>' + DATA.copy.sel_hint + '</span></div>' +
      '<button class="btn" id="next"' + (n < DATA.rules.min_select ? ' disabled' : '') + '>' + (n >= DATA.rules.min_select ? tpl(DATA.copy.btn_next, {n:n}) : DATA.copy.btn_next_disabled) + '</button>' +
    '</div>'
  );
  app.appendChild(dock);
  document.getElementById("next").onclick = function(){
    /* TODO: 接入真实 API —— 提交所选领域，进入 4 周并行投入流程 */
    alert("已选择：" + state.selected.join("、"));
  };
}

function chip(text, on, fn){
  const b = el('<button class="chip' + (on ? ' on' : '') + '">' + text + '</button>');
  b.onclick = fn;
  return b;
}

function domainCard(d){
  const sel = isSel(d.id);
  const card = el('<div class="card' + (sel ? ' sel' : '') + '"></div>');

  const head = el(
    '<div class="d-head">' +
      '<div><div class="d-name">' + d.name + '</div><div class="d-id">' + d.id + '</div></div>' +
      '<button class="pick' + (sel ? ' on' : '') + '">' + (sel ? DATA.copy.picked : DATA.copy.pick) + '</button>' +
    '</div>'
  );
  card.appendChild(head);
  head.querySelector(".pick").onclick = function(){
    if(sel){ state.selected = state.selected.filter(function(x){ return x !== d.id; }); }
    else {
      if(state.selected.length >= DATA.rules.max_select) return;
      state.selected.push(d.id);
    }
    save(); render();
  };

  card.appendChild(el(
    '<div class="metrics">' +
      '<div class="m"><div class="k">' + DATA.copy.d_startup + '</div><div class="v">' + d.startup_cost + '</div></div>' +
      '<div class="m"><div class="k">' + DATA.copy.d_feedback + '</div><div class="v">' + d.feedback_speed + '</div></div>' +
      '<div class="m"><div class="k">' + DATA.copy.d_mechanism + '</div><div class="v">' + d.mechanism_strength + '</div></div>' +
    '</div>'
  ));
  card.appendChild(el('<div class="gardner">' + DATA.copy.d_gardner + '：' + DATA.gardner[d.gardner] + '</div>'));

  const tg = el('<button class="toggle">' + (state.expanded === d.id ? DATA.copy.detail_hide : DATA.copy.detail_toggle) + '</button>');
  card.appendChild(tg);
  tg.onclick = function(){ state.expanded = (state.expanded === d.id ? null : d.id); render(); };

  if(state.expanded === d.id){
    card.appendChild(el(
      '<div class="detail">' +
        '<div class="note">' + DATA.copy.d_note + '</div>' +
        '<div class="kv"><span>' + DATA.copy.d_startup + '</span><b>' + d.startup_cost + '</b></div>' +
        '<div class="kv"><span>' + DATA.copy.d_feedback + '</span><b>' + d.feedback_speed + '</b></div>' +
        '<div class="kv"><span>' + DATA.copy.d_mechanism + '</span><b>' + d.mechanism_strength + '</b></div>' +
        '<div class="kv"><span>' + DATA.copy.d_gardner + '</span><b>' + DATA.gardner[d.gardner] + '（' + d.gardner + '）</b></div>' +
        '<div class="kv"><span>' + DATA.copy.d_level + '</span><b>' + DATA.copy.d_level_val + '</b></div>' +
        '<div class="kv"><span>' + DATA.copy.d_parallel + '</span><b>' + DATA.copy.d_parallel_val + '</b></div>' +
        '<div class="kv"><span>' + DATA.copy.d_eval + '</span><b>' + DATA.copy.d_eval_val + '</b></div>' +
      '</div>'
    ));
  }
  return card;
}
