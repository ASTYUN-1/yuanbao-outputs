  .opt.unknown{color:var(--muted); font-size:13px;}

  .link:hover{color:var(--accent)}
  .card{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px; margin-bottom:10px;}
  .dim-name{font-size:13px; color:var(--muted); margin-bottom:6px;}
  .dim-val{font-size:15px; line-height:1.6; color:var(--text);}

  .chart-wrap{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:12px; margin:14px 0}
  .note{font-size:12px; line-height:1.7; color:var(--muted); margin-top:10px}

/* ============================================================
   状态与存储
   ============================================================ */
const TOTAL = DATA.questions.length;
const state = { screen:"intro", index:0, answers:new Array(TOTAL).fill(undefined) };
let chartInstance = null;

function loadSaved(){
  try{
    const raw = localStorage.getItem(DATA.meta.storage_key);
    if(!raw) return null;
    const obj = JSON.parse(raw);
    if(!obj || !Array.isArray(obj.answers)) return null;
    return obj;
    /* TODO: 接入真实 API —— 登录后改为从服务端读取该用户的坐标系存档 */
  }catch(e){ return null; }
}
function save(){
  const payload = {
    answers: state.answers,
    updated_at: new Date().toISOString(),
    source: "prototype-local"
  };
  try{ localStorage.setItem(DATA.meta.storage_key, JSON.stringify(payload)); }catch(e){}
  /* TODO: 接入真实 API —— 提交 /api/v1/coordinate，unknown 需转换为 null 后上报 */
}
function clearSaved(){
  try{ localStorage.removeItem(DATA.meta.storage_key); }catch(e){}
}

/* ============================================================
   计算：每维取 3 题中的众数，集中度 = 众数次数 / 有效题数 * 100
   （仅为可视化展示口径，不写入任何字段、不作为产品指标）
   ============================================================ */
function computeResult(){
  return DATA.dimensions.map(function(dim){
    const qs = DATA.questions.filter(function(q){ return q.field === dim.field; });
    const picked = qs.map(function(q){
      const i = DATA.questions.indexOf(q);
      return state.answers[i];
    });
    const valid = picked.filter(function(v){ return v !== undefined && v !== DATA.unknown_value; });
    const answered = picked.filter(function(v){ return v !== undefined; });
    const counts = {};
    valid.forEach(function(v){ counts[v] = (counts[v] || 0) + 1; });
    let top = null, topN = 0;
    Object.keys(dim.options).forEach(function(k){
      const n = counts[k] || 0;
      if(n > topN){ topN = n; top = k; }
    });
    const consistency = valid.length ? Math.round(topN / valid.length * 100) : 0;
    return {
      field: dim.field,
      name: dim.name,
      value: top,
      label: top ? dim.options[top] : null,
      consistency: consistency,
      valid_count: valid.length,
      answered_count: answered.length,
      total: qs.length
    };
  });
}

/* ============================================================
   渲染
   ============================================================ */
const app = document.getElementById("app");
function el(html){ const d = document.createElement("div"); d.innerHTML = html.trim(); return d.firstChild; }
function tpl(str, kv){ return str.replace(/\{(\w+)\}/g, function(m,k){ return kv[k] !== undefined ? kv[k] : m; }); }

function render(){
  if(chartInstance){ chartInstance.destroy(); chartInstance = null; }
  app.innerHTML = "";
  if(state.screen === "intro") renderIntro();
  else if(state.screen === "question") renderQuestion();
  else renderResult();
}

function renderIntro(){
  const saved = loadSaved();
  const answered = saved ? saved.answers.filter(function(v){ return v !== undefined; }).length : 0;
  const node = el(
    '<div>' +
      '<span class="tag">' + DATA.copy.intro_tag + '</span>' +
      '<h1>' + DATA.copy.intro_title + '</h1>' +
      '<p>' + DATA.copy.intro_body + '</p>' +
      '<p>' + DATA.copy.intro_hint + '</p>' +
      '<div class="divider"></div>' +
      '<button class="btn" id="btn-start">' + (answered ? DATA.copy.resume : DATA.copy.start) + '</button>' +
      (answered ? '<button class="btn ghost" id="btn-reset">' + DATA.copy.restart + '</button><p class="note">已答 ' + answered + '/18 题，' + DATA.copy.saved + '</p>' : '') +
    '</div>'
  );
  app.appendChild(node);
  document.getElementById("btn-start").onclick = function(){
    if(answered && saved){ state.answers = saved.answers.slice(0, TOTAL); while(state.answers.length < TOTAL) state.answers.push(undefined); }
    state.index = firstUnanswered();
    state.screen = "question";
    render();
  };
  const reset = document.getElementById("btn-reset");
  if(reset) reset.onclick = function(){
    clearSaved();
    state.answers = new Array(TOTAL).fill(undefined);
    state.index = 0; state.screen = "question"; render();
  };
}
function firstUnanswered(){
  for(let i=0;i<TOTAL;i++){ if(state.answers[i] === undefined) return i; }
  return TOTAL - 1;
}

function renderQuestion(){
  const q = DATA.questions[state.index];
  const dim = DATA.dimensions.filter(function(d){ return d.field === q.field; })[0];
  const groupNo = DATA.dimensions.indexOf(dim) + 1;
  const pct = Math.round((state.index + 1) / TOTAL * 100);

  const wrap = el(
    '<div>' +
      '<div class="top-nav">' +
        '<button class="link" id="btn-prev">' + '← ' + DATA.copy.prev + '</button>' +
        '<span>' + tpl(DATA.copy.progress, {cur: state.index + 1}) + '</span>' +
      '</div>' +
      '<div class="bar"><i style="width:' + pct + '%"></i></div>' +
      '<div class="group">' + tpl(DATA.copy.group_of, {g: groupNo, name: dim.name}) + '</div>' +
      '<div class="q">' + q.text + '</div>' +
      '<div id="opts"></div>' +
    '</div>'
  );
  app.appendChild(wrap);

  const box = wrap.querySelector("#opts");
  q.options.forEach(function(o){
    const on = state.answers[state.index] === o.value;
    const b = el('<button class="opt' + (on ? ' on' : '') + '">' + o.label + '</button>');
    b.onclick = function(){ choose(o.value); };
    box.appendChild(b);
  });
  const unk = el('<button class="opt unknown' + (state.answers[state.index] === DATA.unknown_value ? ' on' : '') + '">' + DATA.copy.unknown + '</button>');
  unk.onclick = function(){ choose(DATA.unknown_value); };
  box.appendChild(unk);

  const prev = wrap.querySelector("#btn-prev");
  if(state.index === 0){ prev.style.visibility = "hidden"; }
  else prev.onclick = function(){ state.index -= 1; render(); };
}

function choose(value){
  state.answers[state.index] = value;
  save();
  Array.prototype.forEach.call(app.querySelectorAll(".opt"), function(n){ n.classList.remove("on"); });
  const target = Array.prototype.filter.call(app.querySelectorAll(".opt"), function(n){
    return n.textContent === (value === DATA.unknown_value ? DATA.copy.unknown : DATA.questions[state.index].options.filter(function(o){ return o.value === value; })[0].label);
  })[0];
  if(target) target.classList.add("on");
  setTimeout(function(){
    if(state.index < TOTAL - 1){ state.index += 1; render(); }
    else { state.screen = "result"; render(); }
  }, 260);
}

function renderResult(){
  const res = computeResult();
  const unknownCount = state.answers.filter(function(v){ return v === DATA.unknown_value; }).length;

  const wrap = el(
    '<div>' +
      '<h1>' + DATA.copy.result_title + '</h1>' +
      '<p>' + DATA.copy.result_lead + '</p>' +
      '<div class="chart-wrap"><canvas id="radar" height="260"></canvas></div>' +
      '<p class="note" id="chart-note">' + DATA.copy.chart_note + '</p>' +
      '<div id="dims"></div>' +
      '<div class="divider"></div>' +
      '<p>' + DATA.copy.result_next + '</p>' +
      '<button class="btn ghost" id="btn-copy">' + DATA.copy.copy_btn + '</button>' +
      '<div class="row">' +
        '<button class="btn ghost" id="btn-back">' + DATA.copy.back + '</button>' +
        '<button class="btn ghost" id="btn-redo">' + DATA.copy.redo + '</button>' +
      '</div>' +
      '<p class="note">' + DATA.copy.saved + (unknownCount ? ' · 其中「我不知道」' + unknownCount + ' 题' : '') + '</p>' +
    '</div>'
  );
  app.appendChild(wrap);

  const dims = wrap.querySelector("#dims");
  res.forEach(function(r){
    const text = r.label ? tpl(DATA.copy.dim_known, {label:r.label})
               : (r.answered_count ? DATA.copy.dim_unknown : DATA.copy.dim_none);
    const card = el(
      '<div class="card">' +
        '<div class="dim-name">' + r.name + ' · ' + r.field + '</div>' +
        '<div class="dim-val">' + text + '</div>' +
        '<div class="dim-track"><i style="width:' + r.consistency + '%"></i></div>' +
        '<div class="dim-name" style="margin-top:8px">' + DATA.copy.consistency_label + ' ' + r.consistency + '（' + r.valid_count + '/' + r.total + ' 题有效）</div>' +
      '</div>'
    );
    dims.appendChild(card);
  });

  drawChart(res);

  document.getElementById("btn-copy").onclick = function(){ copyJSON(res); };
  document.getElementById("btn-back").onclick = function(){ state.index = TOTAL - 1; state.screen = "question"; render(); };
  document.getElementById("btn-redo").onclick = function(){
    clearSaved();
    state.answers = new Array(TOTAL).fill(undefined);
    state.index = 0; state.screen = "question"; render();
  };
}

function drawChart(res){
  const cv = document.getElementById("radar");
  if(typeof Chart === "undefined"){
    const tip = el('<p class="note">' + DATA.copy.chart_fail + '</p>');
    cv.parentNode.parentNode.insertBefore(tip, cv.parentNode.nextSibling);
    cv.parentNode.style.display = "none";
    return;
  }
  chartInstance = new Chart(cv.getContext("2d"), {
    type: "radar",
    data: {
      labels: res.map(function(r){ return r.name; }),
      datasets: [{
        label: "集中度",
        data: res.map(function(r){ return r.consistency; }),
        borderColor: "#2DD4BF",
        backgroundColor: "rgba(45,212,191,.16)",
        pointBackgroundColor: "#2DD4BF",
        pointBorderColor: "#0B0F14",
        borderWidth: 2
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      scales: {
        r: {
          min: 0, max: 100,
          ticks: { stepSize: 25, color: "#8B93A1", backdropColor: "transparent", font:{size:9} },
          grid: { color: "rgba(255,255,255,.08)" },
          angleLines: { color: "rgba(255,255,255,.08)" },
          pointLabels: { color: "#E6EAF0", font:{size:12} }
        }
      },
      plugins: {
        legend: { display: false },
        tooltip: {
          callbacks: {
            label: function(ctx){
              const r = res[ctx.dataIndex];
              return r.label ? (r.label + " · 集中度 " + r.consistency) : ("未选择 · 集中度 " + r.consistency);
            }
          }
        }
      }
    }
  });
}

function toJSON(res){
  const out = { spec_version: DATA.meta.spec_version, ssot_checksum: DATA.meta.ssot_checksum, dimensions:{} };
  res.forEach(function(r){ out.dimensions[r.field] = r.value === null ? null : r.value; });
  return out;
}
function copyJSON(res){
  const text = JSON.stringify(toJSON(res), null, 2);
  const btn = document.getElementById("btn-copy");
  function done(ok){ if(btn) btn.textContent = ok ? DATA.copy.copied : DATA.copy.copy_fail; setTimeout(function(){ if(btn) btn.textContent = DATA.copy.copy_btn; }, 1600); }
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(function(){ done(true); }, function(){ fallback(); });
  } else fallback();
  function fallback(){
    try{
      const ta = document.createElement("textarea");
      ta.value = text; document.body.appendChild(ta); ta.select();
      const ok = document.execCommand("copy");
      document.body.removeChild(ta); done(ok);
    }catch(e){ done(false); }
  }
}

render();
</script>
</body>
</html>
